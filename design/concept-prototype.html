<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ee">
  <title>Little Words — navigable design prototype</title>
  <style>
    :root{color-scheme:light;--bg:#f8f5ee;--surface:#fffdf8;--soft:#efede4;--ink:#202c27;--muted:#5b6b61;--green:#176b58;--green2:#dcece3;--line:#d9ded3;--amber:#a66b36;--amber2:#f8ebd8;--shadow:0 16px 50px rgba(22,48,35,.08)}
    body.dark{color-scheme:dark;--bg:#131d19;--surface:#1c2922;--soft:#26362d;--ink:#eeeFE4;--muted:#bac9bc;--green:#addcc3;--green2:#214c3d;--line:#3a4c40;--amber:#e4bc86;--amber2:#443d2e;--shadow:0 16px 50px rgba(0,0,0,.18)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.55}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}.wrap{max-width:1200px;margin:auto;padding:0 30px}.prototype-strip{background:#173e31;color:#f5f6eb;padding:7px 0;font-size:12px;letter-spacing:.035em}.prototype-strip .wrap{display:flex;justify-content:space-between;gap:12px}.prototype-strip strong{font-weight:700}.prototype-strip a{text-decoration:underline;text-underline-offset:3px}
    header{border-bottom:1px solid var(--line);background:var(--bg)}.header-row{min-height:82px;display:flex;align-items:center;gap:28px}.brand{display:flex;align-items:center;gap:11px;font:27px Georgia,serif;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:var(--green);color:var(--bg);font:25px Georgia,serif}.nav{display:flex;gap:4px;margin-left:auto}.nav a,.profile-link{display:inline-flex;align-items:center;padding:11px 14px;border-radius:13px;color:var(--muted);font-size:14px;font-weight:650;white-space:nowrap}.nav a:hover,.profile-link:hover{background:var(--soft);color:var(--ink)}.nav a.current{background:var(--green2);color:var(--green)}.profile-link{border:1px solid var(--line);color:var(--ink)}
    main{min-height:calc(100vh - 121px)}.page{padding-top:34px;padding-bottom:58px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:750;color:var(--green)}h1,h2,h3,p{margin-top:0}h1{font:clamp(43px,5.3vw,78px)/1.03 Georgia,serif;letter-spacing:-.045em;margin-bottom:18px}h2{font:clamp(30px,3vw,42px)/1.12 Georgia,serif;letter-spacing:-.03em;margin-bottom:13px}h3{font-size:19px;line-height:1.2;margin-bottom:8px}p{color:var(--muted)}.lead{font-size:18px;max-width:560px}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.strong{font-weight:700;color:var(--ink)}.topline{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.back{border:0;background:none;color:var(--green);font-weight:700;padding:8px 0}.section-heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:17px}.section-heading h2{margin:0}.text-link{border:0;background:none;color:var(--green);font-weight:700;padding:7px 0;text-align:left}.text-link:hover{text-decoration:underline;text-underline-offset:3px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 23px;min-height:50px;border-radius:16px;border:1px solid transparent;font-weight:740;line-height:1.15;text-align:center;transition:transform .15s,background .15s}.btn:hover:not(:disabled){transform:translateY(-2px)}.btn.primary{background:var(--green);color:var(--bg)}.btn.secondary{background:var(--green2);color:var(--green)}.btn.outline{border-color:var(--line);color:var(--green);background:transparent}.btn.ghost{color:var(--green);background:transparent}.btn.wide{width:100%}.btn.compact{min-height:40px;padding:10px 15px;border-radius:12px;font-size:13px}.button-row{display:flex;flex-wrap:wrap;gap:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.card.soft{background:var(--soft);box-shadow:none;border:0}.notice{background:var(--green2);border:1px solid var(--line);border-radius:17px;padding:15px 18px;font-size:14px;color:var(--ink)}.notice.warm{background:var(--amber2)}.notice strong{color:var(--ink)}.pill{display:inline-flex;align-items:center;border-radius:99px;background:var(--green2);color:var(--green);font-weight:700;font-size:12px;padding:7px 11px}.pill.warm{background:var(--amber2);color:var(--amber)}.divider{height:1px;background:var(--line);margin:24px 0}.grid{display:grid;gap:20px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.stack{display:grid;gap:15px}.row{display:flex;align-items:center;gap:14px}.between{justify-content:space-between}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:27px;overflow:auto}.tab{border:0;border-bottom:3px solid transparent;background:none;padding:12px 18px;color:var(--muted);font-weight:700;white-space:nowrap}.tab.selected{border-bottom-color:var(--green);color:var(--green)}
    .home-hero{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,76px);align-items:center;min-height:360px;padding:25px 0 30px}.home-hero h1{font-size:clamp(62px,8vw,110px)}.hero-sub{font-size:18px;max-width:430px}.choice-card{background:var(--soft);padding:28px;border-radius:30px}.choice-card .btn{font-size:18px;min-height:62px;border-radius:20px}.choice-card .stack{gap:12px}.quick-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px}.quick-grid .card{min-height:165px}.metric{font:34px Georgia,serif;color:var(--green);line-height:1}.progress-track{height:9px;border-radius:99px;background:var(--green2);overflow:hidden}.progress-track span{display:block;height:100%;border-radius:99px;background:var(--green)}.progress-copy{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin:9px 0 0}.progress-copy strong{color:var(--ink)}
    .practice{min-height:calc(100vh - 121px);display:flex;flex-direction:column}.practice-top{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.practice-stage{flex:1;display:grid;place-items:center;min-height:280px;text-align:center}.practice-word{font:500 clamp(88px,18vw,220px)/1.1 Georgia,serif;letter-spacing:.01em;color:var(--ink);margin:0}.practice-word.sentence{font-size:clamp(48px,7vw,105px);max-width:900px}.practice-bottom{padding:20px 0 38px}.practice-actions{display:flex;gap:18px;justify-content:center}.practice-actions .btn{min-width:220px}.direction-hint{display:flex;justify-content:space-between;max-width:500px;margin:0 auto 14px;color:var(--muted);font-size:13px}.practice-surface{touch-action:pan-y;user-select:none}
    .stage-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.stage-card{display:grid;gap:15px}.stage-card .stage-top{display:flex;align-items:start;justify-content:space-between;gap:14px}.stage-card h3{margin:3px 0}.stage-card .examples{font-size:13px;margin:0}.stage-card .stage-foot{display:flex;justify-content:space-between;align-items:center;gap:14px}.switch{appearance:none;width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer}.switch:before{content:"";position:absolute;left:4px;top:4px;width:19px;height:19px;border-radius:50%;background:var(--surface);transition:transform .15s}.switch:checked{background:var(--green)}.switch:checked:before{transform:translateX(19px);background:var(--bg)}.skill-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid var(--line)}.skill-row:last-child{border-bottom:0}.skill-row p{margin:2px 0 0}.word-list{display:flex;flex-wrap:wrap;gap:8px}.word-chip{background:var(--soft);border-radius:9px;padding:8px 12px;font-size:15px}.filter-row{display:flex;flex-wrap:wrap;gap:7px}.filter{border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);padding:8px 12px;font-size:13px;font-weight:650}.filter.selected{background:var(--green2);color:var(--green);border-color:var(--green)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stats .card{padding:20px}.stats strong{display:block;font:32px Georgia,serif;color:var(--green)}.session{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;background:none;border:0;padding:0;color:var(--ink)}.session-details{border-top:1px solid var(--line);margin-top:17px;padding-top:15px}.attempt{display:grid;grid-template-columns:1fr auto;gap:15px;padding:10px 0;border-bottom:1px solid var(--line)}.attempt:last-child{border:0}.attempt .outcome{color:var(--muted);font-size:13px}.attempt .outcome.needs{color:var(--amber)}
    .settings-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border:0}.setting-row p{font-size:13px;margin:4px 0 0}.segmented{display:inline-flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}.segmented button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:9px 14px;font-weight:700}.segmented button.selected{background:var(--surface);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}.profile-card{width:100%;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:18px;display:flex;justify-content:space-between;align-items:center}.profile-card.selected{border:2px solid var(--green)}.field{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#173e31;color:white;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:5}.overlay{position:fixed;inset:0;background:rgba(13,28,20,.55);display:grid;place-items:center;padding:20px;z-index:10}.dialog{max-width:480px;width:100%;background:var(--surface);border-radius:27px;padding:32px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.dialog h2{font-size:37px}.dialog .stack{margin-top:21px}
    @media(max-width:850px){.wrap{padding:0 20px}.header-row{gap:10px;flex-wrap:wrap;padding-top:14px;padding-bottom:12px}.brand{font-size:22px}.nav{order:3;width:100%;margin:0;justify-content:space-between;overflow:auto}.nav a{padding:9px 11px}.profile-link{margin-left:auto}.home-hero{min-height:0;gap:25px}.quick-grid,.stage-layout,.settings-layout{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.page{padding-top:24px}.home-hero{grid-template-columns:1fr;padding:10px 0 30px}.home-hero h1{font-size:65px;margin-bottom:8px}.choice-card{padding:19px}.quick-grid,.grid.two,.grid.three,.stats{grid-template-columns:1fr}.quick-grid .card{min-height:0}.practice{min-height:calc(100dvh - 147px)}.practice-stage{min-height:260px}.practice-word{font-size:clamp(82px,23vw,150px)}.practice-word.sentence{font-size:clamp(40px,10vw,70px)}.practice-actions{flex-direction:column;gap:9px}.practice-actions .btn{width:100%}.topline{align-items:start}.card{padding:19px}.section-heading{align-items:start;flex-direction:column}.dialog{padding:23px}.prototype-strip .wrap{flex-direction:column;gap:2px}.settings-layout{gap:13px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // Review-only sample state. The Android app and its stored data are untouched.
    const stages=[
      {id:'cvc',name:'Short-vowel CVC words',count:158,confident:18,examples:'cat · bed · sun',skills:[['Short a',40,7],['Short e',25,3],['Short i',38,4],['Short o',27,2],['Short u',28,2]]},
      {id:'digraphs',name:'Digraphs & doubled consonants',count:82,confident:3,examples:'shop · chip · duck',skills:[['sh',16,1],['ch',7,0],['th',6,0],['ck',23,1],['Doubled consonants',23,1],['Combined patterns',7,0]]},
      {id:'blends',name:'Consonant blends',count:172,confident:0,examples:'frog · step · clap',skills:[['Blends',126,0],['Blends with other patterns',46,0]]},
      {id:'additional',name:'Additional practice',count:63,confident:0,examples:'on · the · sunset',skills:[['Two-letter words',10,0],['Tricky words',20,0],['Two-syllable words',33,0]]}
    ];
    const sampleAttempts=[
      {word:'cat',result:'Read independently',time:'2.8 s',kind:'Real words'},
      {word:'bed',result:'Read independently',time:'3.4 s',kind:'Real words'},
      {word:'sun',result:'Needs practice',time:'7.1 s',kind:'Real words'},
      {word:'cat sat.',result:'Read independently',time:'6.2 s',kind:'Sentences'},
      {word:'mip',result:'Needs practice',time:'4.5 s',kind:'Silly words'}
    ];
    const state={theme:'light',profile:'Gagan',profiles:['Gagan','Testing'],active:false,mode:'word',card:0,completed:0,lastScore:null,paused:false,showButtons:true,sillyMarker:true,selected:new Set(['cvc-0','cvc-1','cvc-2','cvc-3','cvc-4']),expanded:'cvc',historyFilter:'All',expandedSession:0,wordFilter:'Not tried',advanced:false,letters:false,sentencePool:100,toast:'',legacy:false};
    const cards={word:[['cat','real word'],['sun','real word'],['mip','silly word'],['bed','real word']],sentence:[['cat sat.','short sentence'],['pig dug.','short sentence'],['dog ran.','short sentence']]};
    const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const currentPage=()=>decodeURIComponent(location.hash.slice(1)||'home');
    const stageIncluded=id=>{const stage=stages.find(s=>s.id===id);return stage?stage.skills.every((_,i)=>state.selected.has(`${id}-${i}`)):state.selected.has(id)};
    const includedGroupCount=()=>stages.filter(s=>s.skills.some((_,i)=>state.selected.has(`${s.id}-${i}`))).length+(state.selected.has('silly')?1:0);
    const link=(page,label,cls='')=>`<a href="#${page}" class="${cls}">${label}</a>`;
    const button=(label,action,cls='primary',extra='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;
    const progress=(done,total)=>`<div class="progress-track" role="progressbar" aria-label="${done} of ${total} words confident" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${total?done/total*100:0}%"></span></div><div class="progress-copy"><strong>${done} of ${total} confident</strong><span>${Math.round(done/total*100)}%</span></div>`;
    function shell(content,page){const nav=[['home','Home'],['stages','Learning stages'],['history','History'],['settings','Settings']].map(([p,l])=>link(p,l,page===p||page.startsWith('stage-')&&p==='stages'?'current':'')).join('');return `<div class="prototype-strip"><div class="wrap"><span><strong>DESIGN PROTOTYPE</strong> · Sample progress and history · Click through the screens</span><span>${link('guide','Prototype guide')} · <a href="FEATURE_AUDIT.md">Feature review ↗</a></span></div></div><header><div class="wrap header-row">${link('home','<span class="brand-mark">L</span><span>little words</span>','brand')}<nav class="nav" aria-label="Main navigation">${nav}</nav>${link('profiles',escapeHtml(state.profile)+' ▾','profile-link')}</div></header><main>${content}</main>${state.paused?pauseDialog():''}${state.toast?`<div class="toast" role="status">${escapeHtml(state.toast)}</div>`:''}`}
    function home(){const active=state.active;return `<div class="wrap page"><section class="home-hero"><div><div class="eyebrow">A little reading, every day</div><h1>Let’s read.</h1><p class="hero-sub">A calm place to practise words together. One card, one small step at a time.</p><span class="pill">Reading with ${escapeHtml(state.profile)}</span></div><div class="choice-card"><div class="stack"><div><h3>${active?'Your place is saved':'Choose today’s practice'}</h3><p class="small">${active?`${state.completed} ${state.mode==='word'?'words':'sentences'} completed · ${state.mode==='word'?'Word':'Sentence'} session in progress`:'The choices for this child shape what appears next.'}</p></div>${active?`${button('Resume reading →','resume','primary wide')}${button('End this session','end-session','outline wide')}`:`${button('Start word practice →','start-word','primary wide')}${button('Try short sentences','start-sentence','outline wide')}`}<p class="small" style="margin:0">${state.sentencePool===0?'No sentences fit the current sounds. Adjust choices in Settings.':`${state.sentencePool} sentences available with current sounds.`}</p></div></div></section><section class="quick-grid"><div class="card"><div class="eyebrow">Current learning plan</div><h3 style="margin-top:9px">Short-vowel CVC words</h3>${progress(18,158)}<p class="small" style="margin:12px 0 0">Collection progress stays fixed when practice filters change.</p>${link('stages','Explore learning stages →','text-link')}</div><div class="card"><div class="eyebrow">Next practice pool</div><div class="metric" style="margin:16px 0 8px">158</div><p class="small">words in the selected stage before advanced filters</p>${link('settings','Adjust sounds & letters →','text-link')}</div><div class="card"><div class="eyebrow">Recent reading</div><h3 style="margin-top:15px">5 little moments</h3><p class="small">Review attempts, times, and words to revisit.</p>${link('history','Open history →','text-link')}</div></section></div>`}
    function practice(){const item=cards[state.mode][state.card%cards[state.mode].length],sentence=state.mode==='sentence',silly=item[1]==='silly word';return `<div class="wrap practice"><div class="practice-top"><span class="pill ${silly?'warm':''}">${silly?(state.sillyMarker?'✦ Silly word':'Word practice'):sentence?'Short sentence':'Word practice'}</span><button class="text-link" data-action="pause">Pause ···</button></div><div class="practice-stage practice-surface" id="practiceSurface" aria-label="Reading card. Swipe right for read independently or left for needs practice"><div><div class="eyebrow" style="margin-bottom:22px">${state.completed+1} · Take your time</div><p class="practice-word ${sentence?'sentence':''}">${escapeHtml(item[0])}</p></div></div><div class="practice-bottom"><div class="direction-hint"><span>← Needs practice</span><span>Read independently →</span></div><div class="practice-actions">${state.showButtons?`${button('← Needs practice','score-no','outline')}${button('Read independently →','score-yes','primary')}`:`<p class="small">Swipe left or right to record this card. You can turn buttons on in Settings.</p>`}</div></div></div>`}
    function pauseDialog(){return `<div class="overlay" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pause-title"><span class="eyebrow">Practice paused</span><h2 id="pause-title" style="margin-top:9px">Take your time.</h2><p>Your place is saved. A little practice is enough.</p><div class="stack">${button('Keep reading','keep-reading','primary wide')}${button('Undo last swipe','undo','secondary wide',state.lastScore===null?'disabled':'')}${button('Save & go home','save-home','outline wide')}${button('End practice & view history','end-session','ghost wide')}</div></div></div>`}
    function stagesPage(){return `<div class="wrap page"><div class="topline"><div><div class="eyebrow">${escapeHtml(state.profile)}’s learning</div><h1 style="margin-top:7px">Every little step.</h1><p class="lead">Choose what to practise next. Confidence grows across separate sessions.</p></div><span class="pill">475 real words in the collection</span></div><div class="tabs">${link('stages','Learning stages','tab selected')}${link('history','History','tab')}</div>${state.active?`<div class="notice" style="margin-bottom:21px"><strong>Current session stays as it is.</strong> Saved choices will shape the next session.</div>`:''}${state.legacy?`<div class="notice warm" style="margin-bottom:21px"><strong>Custom word groups are active.</strong> Saving stages will replace the old length-group selection and reset sound and letter restrictions.</div>`:''}<div class="stage-layout"><div class="stack">${stages.map(stage=>`<article class="card stage-card"><div class="stage-top"><div><span class="eyebrow">${stage.count} words in collection</span><h3>${stage.name}</h3><p class="examples">For example: ${stage.examples}</p></div><input type="checkbox" class="switch" aria-label="Include ${stage.name} in practice" data-stage="${stage.id}" ${stageIncluded(stage.id)?'checked':''}></div>${progress(stage.confident,stage.count)}<div class="stage-foot"><span class="small muted">${stage.id==='cvc'?'158':stage.id==='digraphs'?'82':stage.id==='blends'?'172':'63'} available before advanced filters</span>${link('stage-'+stage.id,'View skills & words →','text-link')}</div></article>`).join('')}<article class="card stage-card"><div class="stage-top"><div><span class="eyebrow">Separate practice</span><h3>Silly words</h3><p class="examples">232 made-up words · do not count toward real-word milestones</p></div><input type="checkbox" class="switch" aria-label="Include silly words" data-stage="silly" ${state.selected.has('silly')?'checked':''}></div></article></div><aside class="stack"><div class="card soft"><span class="eyebrow">What confident means</span><h2 style="font-size:30px;margin-top:10px">Two sessions, one word.</h2><p>An independent read in two different sessions marks a real word confident. A later needs-practice read marks it for review while keeping that milestone.</p></div><div class="card"><span class="eyebrow">Practice choices</span><h3 style="margin-top:10px">${includedGroupCount()} groups included</h3><p class="small">You can mix earlier review with new content. Advanced sound and letter filters may narrow what is available.</p>${button('Save choices','save-stages','primary wide')}</div><div class="notice">Collection totals include every reviewed real word, including ones outside the current practice choices.</div></aside></div></div>`}
    function stageDetail(id){const st=stages.find(x=>x.id===id)||stages[0],words=id==='cvc'?['cat','bed','sun','pig','dog','run','hat','pen','sit','cup']:id==='digraphs'?['shop','chip','duck','then','bell']:id==='blends'?['frog','step','clap','drum']:['on','the','sunset','if'];return `<div class="wrap page"><div class="topline">${link('stages','← Learning stages','back')}<span class="pill">${st.count} words</span></div><div class="eyebrow">Learning stage</div><h1>${st.name}</h1><p class="lead">A word belongs to one skill for counting. Practice can include any mix of skills.</p><div class="grid two"><div class="card"><h3>Collection progress</h3>${progress(st.confident,st.count)}<p class="small" style="margin:15px 0 0">${st.count-st.confident} words are still practising or not tried. The total is independent of your current filters.</p></div><div class="card soft"><h3>For current practice</h3><p>Sound and letter choices can make fewer words available than the full collection.</p><span class="pill">${st.count} available with sample choices</span></div></div><div class="section-heading" style="margin-top:35px"><h2>Skills in this stage</h2><span class="small muted">Toggle skills for future sessions</span></div><div class="card">${st.skills.map(([name,total,done],i)=>`<div class="skill-row"><div style="flex:1"><strong>${name}</strong><p class="small">${done} of ${total} confident · ${total} available for practice</p><div class="progress-track" style="margin-top:9px"><span style="width:${done/total*100}%"></span></div></div><input type="checkbox" class="switch" aria-label="Include ${name}" data-skill="${st.id}-${i}" ${state.selected.has(`${st.id}-${i}`)?'checked':''}></div>`).join('')}</div><div class="section-heading" style="margin-top:35px"><h2>Word lists</h2><span class="small muted">Illustrative sample words</span></div><div class="filter-row" style="margin-bottom:17px">${['Not tried','Practising','Confident','Needs review'].map(f=>`<button class="filter ${state.wordFilter===f?'selected':''}" data-word-filter="${f}">${f}</button>`).join('')}</div><div class="card"><div class="word-list">${(state.wordFilter==='Confident'?words.slice(0,3):state.wordFilter==='Needs review'?words.slice(3,5):state.wordFilter==='Practising'?words.slice(2,6):words).map(w=>`<span class="word-chip">${w}</span>`).join('')}</div><p class="small" style="margin:15px 0 0">Sample list for design review. The Android app uses the full catalogue and actual child history.</p></div><div style="margin-top:24px">${button('Save choices','save-stages','primary')}</div></div>`}
    function history(){let rows=sampleAttempts.filter(a=>state.historyFilter==='All'||a.kind===state.historyFilter),independent=rows.filter(a=>a.result==='Read independently').length;return `<div class="wrap page"><div class="eyebrow">${escapeHtml(state.profile)}’s progress</div><h1 style="margin-top:7px">A quiet record.</h1><p class="lead">These are parent observations, not a test score. Look for confidence growing over time.</p><div class="tabs">${link('stages','Learning stages','tab')}${link('history','History','tab selected')}</div><div class="filter-row" style="margin-bottom:18px">${['All','Real words','Silly words','Sentences'].map(f=>`<button class="filter ${state.historyFilter===f?'selected':''}" data-history-filter="${f}">${f}</button>`).join('')}</div><div class="stats"><div class="card"><strong>${rows.length}</strong><span class="small muted">attempts</span></div><div class="card"><strong>${independent}</strong><span class="small muted">independent reads</span></div><div class="card"><strong>${rows.length-independent}</strong><span class="small muted">needed practice</span></div><div class="card"><strong>${rows.length?Math.round(independent/rows.length*100):0}%</strong><span class="small muted">independent reads</span></div></div><div class="section-heading" style="margin-top:35px"><h2>Practice sessions</h2><span class="small muted">Newest first</span></div><div class="stack"><div class="card"><button class="session" data-action="toggle-session"><span><strong>Today · Word practice</strong><br><span class="small muted">${rows.length} attempts · ${independent} independent reads</span></span><span aria-hidden="true">${state.expandedSession===0?'⌄':'›'}</span></button>${state.expandedSession===0?`<div class="session-details">${rows.map((a,i)=>`<div class="attempt"><div><strong>${i+1}. ${a.word}</strong><div class="outcome ${a.result==='Needs practice'?'needs':''}">${a.result} · ${a.kind}</div></div><span class="small muted">${a.time}</span></div>`).join('')||'<p>No attempts in this filter.</p>'}</div>`:''}</div><div class="card"><button class="session" data-action="toggle-old-session"><span><strong>Yesterday · Sentence practice</strong><br><span class="small muted">3 attempts · 2 independent reads</span></span><span aria-hidden="true">${state.expandedSession===1?'⌄':'›'}</span></button>${state.expandedSession===1?'<div class="session-details"><div class="attempt"><div><strong>1. pig dug.</strong><div class="outcome">Read independently · Sentences</div></div><span class="small muted">5.3 s</span></div><div class="attempt"><div><strong>2. dog ran.</strong><div class="outcome needs">Needs practice · Sentences</div></div><span class="small muted">8.1 s</span></div></div>':''}</div></div><div class="grid two" style="margin-top:23px"><div class="card soft"><h3>Reading to revisit</h3><p style="margin-bottom:0">sun · mip · dog ran.</p><p class="small" style="margin-top:10px">Based on the latest attempt for each item.</p></div><div class="card soft"><h3>About milestones</h3><p style="margin-bottom:0">Sentence and silly-word attempts appear here. Real-word stage confidence uses individual real-word attempts across sessions.</p></div></div></div>`}
    function settings(){return `<div class="wrap page"><div class="eyebrow">Preferences for ${escapeHtml(state.profile)}</div><h1 style="margin-top:7px">Make it their own.</h1><p class="lead">Shape the next practice session and choose how cards appear.</p>${state.active?'<div class="notice" style="margin-bottom:19px"><strong>Your current session keeps its original choices.</strong> Content changes apply to the next session.</div>':''}<div class="settings-layout"><div class="stack"><div class="card"><h3>Practice content</h3><p>Learning stages choose which words to practise. Advanced sound and letter choices can narrow that pool.</p>${link('stages','Open learning stages →','text-link')}<div class="divider"></div><button class="text-link" data-action="advanced">${state.advanced?'Hide':'Show'} advanced sound & letter choices ${state.advanced?'⌃':'⌄'}</button>${state.advanced?`<div style="margin-top:16px"><p class="small">Sound patterns included for the next session</p><div class="filter-row">${['Short a','Short e','Short i','Short o','Short u','sh','ch','th','ck','Blends'].map(f=>`<button class="filter ${state.sentencePool>0||f==='Short a'?'selected':''}" data-action="pattern">${f}</button>`).join('')}</div><button class="text-link" style="margin-top:12px" data-action="letters">${state.letters?'Hide':'Choose'} individual letters</button>${state.letters?`<div class="filter-row">${'abcdefghijklmnopqrstuvwxyz'.split('').map(l=>`<button class="filter selected" data-action="letter">${l}</button>`).join('')}</div>`:''}</div>`:''}<div class="notice ${state.sentencePool===0?'warm':''}" style="margin-top:19px"><strong>${state.sentencePool} short sentences available.</strong> Sentence readiness is based on allowed sounds and letters; a sentence can contain a word catalogued in another stage.</div></div><div class="card"><h3>Reading screen</h3><div class="setting-row"><div><strong>Show scoring buttons</strong><p>Use buttons as well as swipes.</p></div><input class="switch" type="checkbox" data-setting="showButtons" aria-label="Show scoring buttons" ${state.showButtons?'checked':''}></div><div class="setting-row"><div><strong>Mark silly words</strong><p>Show a small label above made-up words.</p></div><input class="switch" type="checkbox" data-setting="sillyMarker" aria-label="Mark silly words" ${state.sillyMarker?'checked':''}></div>${!state.sillyMarker&&state.selected.has('silly')?'<div class="notice warm" style="margin-top:15px">Silly words are included, but they will not be labelled on the reading card.</div>':''}</div></div><aside class="stack"><div class="card"><h3>Appearance</h3><p class="small">For this profile. Changes preview immediately.</p><div class="segmented" role="group" aria-label="Appearance">${['System','Light','Dark'].map(t=>`<button class="${state.theme===t.toLowerCase()?'selected':''}" data-theme="${t.toLowerCase()}">${t}</button>`).join('')}</div></div><div class="card soft"><h3>Your reading stays here</h3><p>Practice history is stored on this device. Uninstalling or clearing app data removes it.</p><p class="small" style="margin:0">Export and restore are not available yet.</p></div>${button('Save preferences','save-settings','primary wide')}</aside></div></div>`}
    function profiles(){return `<div class="wrap page"><div class="topline">${link('home','← Home','back')}</div><div class="eyebrow">Separate little journeys</div><h1 style="margin-top:7px">Reading profiles.</h1><p class="lead">Each child has their own choices, saved place, and progress.</p><div class="grid two"><div class="stack">${state.profiles.map(name=>`<button class="profile-card ${state.profile===name?'selected':''}" data-profile="${escapeHtml(name)}"><span><strong>${escapeHtml(name)}</strong><br><span class="small muted">${state.profile===name?'Current profile':'Switch to this profile'}</span></span><span>${state.profile===name?'✓':'→'}</span></button>`).join('')}</div><div class="card soft"><h3>Add a profile</h3><p class="small">Use Testing to explore without changing a child’s progress.</p><input class="field" id="profileName" placeholder="Child’s name or Testing" maxlength="40" aria-label="New profile name"><div style="margin-top:12px">${button('Create & switch','create-profile','primary wide')}</div></div></div></div>`}
    function guide(){return `<div class="wrap page"><div class="eyebrow">Review this design</div><h1 style="margin-top:7px">Prototype guide.</h1><p class="lead">Click through the main screens and try the sample controls. Everything here is illustrative and resets when the page reloads.</p><div class="grid two"><div class="card"><h3>Try the core flow</h3><ol><li>Start word or sentence practice from Home.</li><li>Score a card with the buttons or horizontal swipe.</li><li>Pause, undo, save your place, or end the session.</li><li>Open History to inspect a session.</li></ol>${link('home','Start at Home →','text-link')}</div><div class="card"><h3>Review the choices</h3><ol><li>Open Learning stages and inspect a stage.</li><li>Toggle a stage or a skill and save choices.</li><li>Visit Settings to see advanced filters and appearance.</li><li>Switch profiles to review that flow.</li></ol>${link('stages','Open Learning stages →','text-link')}</div></div><div class="notice" style="margin-top:20px"><strong>Design question:</strong> Should sentence practice require every word to belong to selected stages, or should it follow the sounds the child is ready for? The current Android app follows sounds.</div></div>`}
    function render(){const page=currentPage();document.body.classList.toggle('dark',state.theme==='dark');let content=page==='home'?home():page==='practice'?practice():page==='stages'?stagesPage():page.startsWith('stage-')?stageDetail(page.slice(6)):page==='history'?history():page==='settings'?settings():page==='profiles'?profiles():guide();document.getElementById('app').innerHTML=shell(content,page);document.title=`${page.replace('stage-','Stage: ')} · Little Words prototype`;if(page==='practice')wireSwipe()}
    function go(page){location.hash=page;render();window.scrollTo(0,0)}
    function flash(message){state.toast=message;render();setTimeout(()=>{state.toast='';render()},2600)}
    function start(mode){if(mode==='sentence'&&state.sentencePool===0){go('settings');flash('Choose sounds or letters to make sentences available.');return}state.mode=mode;state.active=true;state.card=0;state.completed=0;state.lastScore=null;go('practice')}
    function score(success){state.lastScore={card:state.card,completed:state.completed};state.card++;state.completed++;render()}
    function wireSwipe(){const el=document.getElementById('practiceSurface');if(!el)return;let x=null,y=null;el.addEventListener('pointerdown',e=>{x=e.clientX;y=e.clientY});el.addEventListener('pointerup',e=>{if(x!==null&&Math.abs(e.clientX-x)>65&&Math.abs(e.clientX-x)>Math.abs(e.clientY-y)*1.4)score(e.clientX>x);x=null;y=null})}
    document.addEventListener('click',e=>{const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;switch(action){case 'start-word':start('word');break;case 'start-sentence':start('sentence');break;case 'resume':go('practice');break;case 'score-yes':score(true);break;case 'score-no':score(false);break;case 'pause':state.paused=true;render();break;case 'keep-reading':state.paused=false;render();break;case 'undo':if(state.lastScore){state.card=state.lastScore.card;state.completed=state.lastScore.completed;state.lastScore=null}state.paused=false;render();break;case 'save-home':state.paused=false;go('home');break;case 'end-session':state.active=false;state.paused=false;go('history');break;case 'save-stages':flash('Practice choices saved for the next session.');break;case 'save-settings':flash('Preferences saved for this profile.');break;case 'advanced':state.advanced=!state.advanced;render();break;case 'letters':state.letters=!state.letters;render();break;case 'pattern':state.sentencePool=state.sentencePool?0:100;render();break;case 'letter':state.sentencePool=state.sentencePool?0:100;render();break;case 'toggle-session':state.expandedSession=state.expandedSession===0?-1:0;render();break;case 'toggle-old-session':state.expandedSession=state.expandedSession===1?-1:1;render();break;case 'create-profile':{const name=document.getElementById('profileName')?.value.trim();if(!name)return flash('Enter a profile name.');if(state.profiles.some(n=>n.toLowerCase()===name.toLowerCase()))return flash('That name is already in use.');state.profiles.push(name);state.profile=name;state.active=false;go('home');break}}});
    document.addEventListener('change',e=>{const t=e.target;if(t.dataset.stage){const id=t.dataset.stage;if(id==='silly'){t.checked?state.selected.add(id):state.selected.delete(id)}else{const stage=stages.find(s=>s.id===id);stage.skills.forEach((_,i)=>t.checked?state.selected.add(`${id}-${i}`):state.selected.delete(`${id}-${i}`))}render()}if(t.dataset.skill){t.checked?state.selected.add(t.dataset.skill):state.selected.delete(t.dataset.skill);render()}if(t.dataset.setting){state[t.dataset.setting]=t.checked;render()}});
    document.addEventListener('click',e=>{const t=e.target.closest('[data-theme],[data-profile],[data-history-filter],[data-word-filter]');if(!t)return;if(t.dataset.theme){state.theme=t.dataset.theme;render()}if(t.dataset.profile){state.profile=t.dataset.profile;state.active=false;go('home')}if(t.dataset.historyFilter){state.historyFilter=t.dataset.historyFilter;render()}if(t.dataset.wordFilter){state.wordFilter=t.dataset.wordFilter;render()}});
    window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
  </script>
</body>
</html>
